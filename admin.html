<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard | WEGO V2Ray</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060a; --bg2:#0a0c14; --card:#11141d; --border:rgba(255,255,255,0.08);
    --text:#eceef6; --muted:#8f93a8; --gold:#f5c542; --green:#34d399; --red:#f87171; --blue:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  
  /* دعم الخط العربي والإنجليزي */
  body{background:var(--bg);color:var(--text);line-height:1.5;transition:0.3s;}
  html[dir="ltr"] body { font-family:'Inter',sans-serif; }
  html[dir="rtl"] body { font-family:'Cairo',sans-serif; }

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ::-webkit-scrollbar{width:8px} ::-webkit-scrollbar-thumb{background:#2a2d3a;border-radius:10px}

  /* Loading Screen (عشان نمنع الجليتش) */
  .loading-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999;}
  .spinner{width:50px;height:50px;border-radius:50%;border:3px solid rgba(245,197,66,.1);border-top-color:var(--gold);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Login Screen */
  .login-screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:100;}
  .login-box{background:var(--card);padding:40px;border-radius:20px;border:1px solid var(--border);width:100%;max-width:400px;text-align:center;}
  .login-box h1{margin-bottom:20px;font-size:24px;color:#fff;font-weight:700;}
  .login-box input{width:100%;padding:14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:#fff;margin-bottom:15px;text-align:center;font-size:16px;outline:none;}
  .login-box input:focus{border-color:var(--gold);}
  .login-box button{width:100%;padding:14px;border-radius:12px;background:var(--gold);color:#000;font-weight:700;font-size:16px;transition:.3s;}
  .login-box button:hover{background:#e0a800;}

  /* Dashboard */
  .dashboard{display:none;padding:40px;max-width:1400px;margin:0 auto;}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--border); flex-wrap:wrap; gap:15px;}
  .header h2{color:#fff;font-size:22px;font-weight:700;}
  .header-actions {display:flex; gap: 10px; align-items:center;}
  
  .btn-logout{background:rgba(255,107,107,.1);color:var(--red);padding:8px 16px;border-radius:8px;border:1px solid rgba(255,107,107,.3);font-size:14px;font-weight:600;transition:.3s;}
  .btn-logout:hover{background:rgba(255,107,107,.2);}
  .btn-export{background:rgba(59,130,246,.1);color:var(--blue);padding:8px 16px;border-radius:8px;border:1px solid rgba(59,130,246,.3);font-size:14px;font-weight:600;transition:.3s;}
  .btn-export:hover{background:rgba(59,130,246,.2);}
  .btn-lang{background:rgba(255,255,255,.05);color:#fff;padding:8px 16px;border-radius:8px;border:1px solid var(--border);font-size:14px;font-weight:600;transition:.3s;}
  .btn-lang:hover{background:rgba(255,255,255,.1);}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:30px;}
  .stat-card{background:var(--card);padding:25px;border-radius:16px;border:1px solid var(--border);}
  .stat-card h3{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;}
  .stat-card b{font-size:28px;color:#fff;font-weight:700;}

  .search-box{width:100%;padding:14px 20px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:#fff;margin-bottom:20px;font-size:15px;outline:none;}
  .search-box:focus{border-color:var(--gold);}

  .table-container{background:var(--card);border-radius:16px;border:1px solid var(--border);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:1000px;}
  th, td{padding:16px 20px;border-bottom:1px solid var(--border);font-size:14px;}
  html[dir="ltr"] th, html[dir="ltr"] td { text-align: left; }
  html[dir="rtl"] th, html[dir="rtl"] td { text-align: right; }
  
  th{background:rgba(255,255,255,0.02);color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;}
  tr:hover{background:rgba(255,255,255,0.015);}
  
  .badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;display:inline-block;}
  .badge.active{background:rgba(52,211,153,.15);color:var(--green);}
  .badge.expired{background:rgba(248,113,113,.15);color:var(--red);}
  
  .action-btn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.3);cursor:pointer;transition:.2s;}
  .action-btn:hover{background:rgba(52,211,153,.2);}
  .action-btn.link-btn{background:rgba(139,92,246,.1);color:#c4b5fd;border-color:rgba(139,92,246,.3);}
  .action-btn.link-btn:hover{background:rgba(139,92,246,.2);}
</style>
</head>
<body>

<!-- شاشة التحميل -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
</div>

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1 data-i18n="login_title">WEGO Admin</h1>
    <p style="color:var(--muted); margin-bottom:20px; font-size:14px;" data-i18n="login_desc">Enter your admin password to continue</p>
    <input type="password" id="adminPass" placeholder="Password" />
    <button onclick="login()" data-i18n="login_btn">Sign In</button>
    <p id="loginError" style="color:var(--red); margin-top:10px; display:none; font-size:14px; font-weight:600;" data-i18n="login_error">Incorrect password!</p>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
  <div class="header">
    <h2 data-i18n="dash_title">Website Orders</h2>
    <div class="header-actions">
      <button class="btn-lang" onclick="toggleLanguage()" id="langBtn">عربي</button>
      <button class="btn-export" onclick="exportCSV()" data-i18n="btn_export">↓ Export CSV</button>
      <button class="btn-logout" onclick="logout()" data-i18n="btn_logout">Logout</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><h3 data-i18n="stat_total">Total Orders</h3><b id="totalOrders">0</b></div>
    <div class="stat-card"><h3 data-i18n="stat_active">Active Orders</h3><b id="activeOrders" style="color:var(--green);">0</b></div>
    <div class="stat-card"><h3 data-i18n="stat_expired">Expired Orders</h3><b id="expiredOrders" style="color:var(--red);">0</b></div>
    <div class="stat-card"><h3 data-i18n="stat_data">Total Data Sold</h3><b id="totalDataSold">0 GB</b></div>
  </div>

  <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by customer name or email..." oninput="filterTable()" data-i18n-placeholder="search_placeholder">

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-i18n="th_customer">Customer</th>
          <th data-i18n="th_limit">Limit</th>
          <th data-i18n="th_used">Used</th>
          <th data-i18n="th_expiry">Expiry</th>
          <th data-i18n="th_status">Status</th>
          <th data-i18n="th_actions">Actions</th>
        </tr>
      </thead>
      <tbody id="ordersTable">
        <!-- Data populated via JS -->
      </tbody>
    </table>
  </div>
</div>

<script>
  // 🟢 قاموس الترجمة
  const translations = {
    en: {
      login_title: "WEGO Admin",
      login_desc: "Enter your admin password to continue",
      login_btn: "Sign In",
      login_error: "Incorrect password!",
      dash_title: "Website Orders",
      btn_export: "↓ Export CSV",
      btn_logout: "Logout",
      stat_total: "Total Orders",
      stat_active: "Active Orders",
      stat_expired: "Expired Orders",
      stat_data: "Total Data Sold",
      search_placeholder: "🔍 Search by customer name or email...",
      th_customer: "Customer",
      th_limit: "Limit",
      th_used: "Used",
      th_expiry: "Expiry",
      th_status: "Status",
      th_actions: "Actions",
      status_active: "Active",
      status_expired: "Expired",
      expiry_first: "From 1st use",
      no_orders: "No orders found.",
      btn_config: "📋 Config",
      btn_link: "🔗 Link",
      copy_success: "✅ Copied",
      loading: "Loading..."
    },
    ar: {
      login_title: "لوحة تحكم WEGO",
      login_desc: "أدخل باسورد الأدمن للدخول",
      login_btn: "دخول",
      login_error: "باسورد غلط!",
      dash_title: "أوردرات الموقع",
      btn_export: "↓ تصدير CSV",
      btn_logout: "تسجيل الخروج",
      stat_total: "إجمالي الأوردرات",
      stat_active: "الأوردرات النشطة",
      stat_expired: "الأوردرات المنتهية",
      stat_data: "إجمالي البيانات المبيعة",
      search_placeholder: "🔍 ابحث بالاسم أو الإيميل...",
      th_customer: "العميل",
      th_limit: "المساحة",
      th_used: "المستهلك",
      th_expiry: "تاريخ الانتهاء",
      th_status: "الحالة",
      th_actions: "الإجراءات",
      status_active: "نشط",
      status_expired: "منتهي",
      expiry_first: "من أول اتصال",
      no_orders: "لا يوجد أوردرات.",
      btn_config: "📋 نسخ الكونفيج",
      btn_link: "🔗 نسخ اللينك",
      copy_success: "✅ تم النسخ",
      loading: "جاري..."
    }
  };

  let currentLang = localStorage.getItem('wegoAdminLang') || 'ar'; // اللغة الافتراضية عربي
  let allOrders = [];

  // 🟢 دالة تغيير اللغة
  function applyLanguage() {
    const dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('htmlRoot').setAttribute('dir', dir);
    document.getElementById('htmlRoot').setAttribute('lang', currentLang);
    
    // تغيير النصوص
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[currentLang][key]) {
        el.textContent = translations[currentLang][key];
      }
    });

    // تغيير الـ Placeholder
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (translations[currentLang][key]) {
        el.placeholder = translations[currentLang][key];
      }
    });

    // تغيير زرار اللغة
    document.getElementById('langBtn').textContent = currentLang === 'ar' ? 'English' : 'عربي';

    // إعادة رسم الجدول عشان الكلمات تتغير
    renderTable(allOrders);
  }

  function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('wegoAdminLang', currentLang);
    applyLanguage();
  }

  // 🟢 التحقق من الباسورد أول ما الصفحة تفتح (عشان نمنع الجليتش)
  window.onload = async function() {
    applyLanguage(); // تطبيق اللغة
    
    const savedPass = sessionStorage.getItem('wegoAdminPass');
    if (savedPass) {
      document.getElementById('adminPass').value = savedPass;
      await login(true); // بنبعت true عشان ميعملش إيرور لو الباسورد غلط
    } else {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }
  }

  async function login(isAutoLogin = false) {
    const pass = document.getElementById('adminPass').value;
    if(!isAutoLogin) document.getElementById('loginError').style.display = 'none';

    try {
      const res = await fetch('/api/admin/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const result = await res.json();

      if (result.success) {
        sessionStorage.setItem('wegoAdminPass', pass);
        
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        allOrders = result.data;
        renderTable(allOrders);
        updateStats(allOrders);
      } else {
        if(!isAutoLogin) document.getElementById('loginError').style.display = 'block';
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        sessionStorage.removeItem('wegoAdminPass'); // مسح الباسورد لو غلط
      }
    } catch (err) {
      if(!isAutoLogin) alert('Server connection failed');
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }
  }

  function logout() {
    sessionStorage.removeItem('wegoAdminPass');
    location.reload();
  }

  function updateStats(orders) {
    document.getElementById('totalOrders').textContent = orders.length;
    let active = 0, expired = 0, totalDataBytes = 0;
    
    orders.forEach(o => {
      let isExpired = o.expiry !== 0 && (o.expiry * 1000) < Date.now();
      if (o.status === 'active' && !isExpired) active++;
      else expired++;
      
      if (o.volume > 0) totalDataBytes += o.volume;
    });
    
    document.getElementById('activeOrders').textContent = active;
    document.getElementById('expiredOrders').textContent = expired;
    let totalGB = (totalDataBytes / (1024 * 1024 * 1024)).toFixed(0);
    document.getElementById('totalDataSold').textContent = totalGB + ' GB';
  }

  function renderTable(orders) {
    const tbody = document.getElementById('ordersTable');
    tbody.innerHTML = '';
    const t = translations[currentLang];

    if (orders.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:var(--muted);">${t.no_orders}</td></tr>`;
      return;
    }

    orders.forEach(o => {
      let volText = o.volume === 0 ? 'Unlimited' : (o.volume / (1024*1024*1024)).toFixed(0) + ' GB';
      let usedText = ((o.up + o.down) / (1024*1024*1024)).toFixed(2) + ' GB';
      let isExpired = o.expiry !== 0 && (o.expiry * 1000) < Date.now();
      let statusText = (o.status === 'active' && !isExpired) ? t.status_active : t.status_expired;
      let badgeClass = (o.status === 'active' && !isExpired) ? 'active' : 'expired';
      
      let expiryText = o.expiry === 0 ? t.expiry_first : new Date(o.expiry * 1000).toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-GB');
      
      let displayName = o.name.split('_')[0];
      let emailDisplay = 'No Email Provided';
      if (o.note && o.note.includes('Email:')) {
        emailDisplay = o.note.split('Email:')[1].split('|')[0].trim();
        let fullName = o.note.split('Name:')[1]?.trim();
        if(fullName) displayName = fullName;
      }

      tbody.innerHTML += `
        <tr>
          <td>
            <div style="font-weight:700; color:#fff; font-size:15px; margin-bottom:2px;">${displayName}</div>
            <div style="font-size:12px; color:var(--muted);">${emailDisplay}</div>
          </td>
          <td style="font-weight:600;">${volText}</td>
          <td>${usedText}</td>
          <td>${expiryText}</td>
          <td><span class="badge ${badgeClass}">${statusText}</span></td>
          <td>
            <div style="display:flex; gap:8px; justify-content: ${currentLang === 'ar' ? 'flex-start' : 'flex-start'};">
              <button class="action-btn" onclick="copyConfig('${o.subUrl}', this)" data-config-btn>${t.btn_config}</button>
              <button class="action-btn link-btn" onclick="copyLink('${o.subUrl}', this)" data-link-btn>${t.btn_link}</button>
            </div>
          </td>
        </tr>
      `;
    });
  }

  function filterTable() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allOrders.filter(o => o.name.toLowerCase().includes(query) || (o.note && o.note.toLowerCase().includes(query)));
    renderTable(filtered);
  }

  async function copyConfig(subUrl, btn) {
    if (!subUrl) return alert('No config available');
    const t = translations[currentLang];
    const originalText = btn.innerHTML;
    btn.innerHTML = t.loading;
    
    try {
      const res = await fetch('http://localhost:3000/api/get-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subUrl })
      });
      const data = await res.json();
      
      if (data.success) {
        await navigator.clipboard.writeText(data.vless);
        btn.innerHTML = t.copy_success;
        setTimeout(() => btn.innerHTML = originalText, 2000);
      } else {
        alert('Config not found');
        btn.innerHTML = originalText;
      }
    } catch (err) {
      alert('Connection error');
      btn.innerHTML = originalText;
    }
  }

  function copyLink(subUrl, btn) {
    if (!subUrl) return alert('No link available');
    const t = translations[currentLang];
    navigator.clipboard.writeText(subUrl);
    const originalText = btn.innerHTML;
    btn.innerHTML = t.copy_success;
    setTimeout(() => btn.innerHTML = originalText, 2000);
  }

  function exportCSV() {
    if (allOrders.length === 0) return alert('No data to export');
    
    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Customer Name,Email,Limit,Used,Expiry Date,Status,Sub Link\n";

    allOrders.forEach(o => {
      let volText = o.volume === 0 ? 'Unlimited' : (o.volume / (1024*1024*1024)).toFixed(0) + ' GB';
      let usedText = ((o.up + o.down) / (1024*1024*1024)).toFixed(2) + ' GB';
      let isExpired = o.expiry !== 0 && (o.expiry * 1000) < Date.now();
      let statusText = (o.status === 'active' && !isExpired) ? 'Active' : 'Expired';
      let expiryText = o.expiry === 0 ? 'From 1st use' : new Date(o.expiry * 1000).toLocaleDateString('en-GB');
      
      let displayName = o.name.split('_')[0];
      let emailDisplay = '';
      if (o.note && o.note.includes('Email:')) {
        emailDisplay = o.note.split('Email:')[1].split('|')[0].trim();
        let fullName = o.note.split('Name:')[1]?.trim();
        if(fullName) displayName = fullName;
      }

      let row = `"${displayName}","${emailDisplay}","${volText}","${usedText}","${expiryText}","${statusText}","${o.subUrl}"`;
      csvContent += row + "\n";
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "wego_orders.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
</body>
</html>
